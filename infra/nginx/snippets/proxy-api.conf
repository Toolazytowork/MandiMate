# MandiMate — reverse-proxy settings shared by /api and /media (FastAPI at $mandimate_api).
#
# This server is the edge of the stack, so client-supplied forwarding headers are overwritten,
# never appended: the API's per-IP login throttling must not be bypassable with a forged
# X-Forwarded-For. When a load balancer is added in front, enable the realip module for its
# address range instead (docs/DEPLOYMENT.md).

proxy_pass $mandimate_api;
proxy_http_version 1.1;
proxy_redirect off;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $mandimate_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
