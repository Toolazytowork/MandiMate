# MandiMate — security headers for every document and static asset served by the web container.
#
# Included from each static location in ../default.conf: nginx drops inherited add_header
# directives as soon as a location declares its own, so the headers live in one snippet.
# Proxied /api and /media responses keep the headers set by the API's own middleware.
#
# HSTS is intentionally absent: it belongs on the TLS terminator in front of this container
# (see docs/DEPLOYMENT.md), because this server only speaks plain HTTP inside the network.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Microphone: voice listing (Web Speech API). Camera: photo-assisted listing.
# Geolocation: "use my location" when a farmer registers a harvest.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), browsing-topics=()" always;

# Same-origin everything: fonts are self-hosted, the API is proxied under /api, uploads under
# /media. 'unsafe-inline' covers the pre-paint bootstrap script in index.html (no-js → js) and
# the inline styles React and motion write; no third-party origin is allowed anywhere.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
