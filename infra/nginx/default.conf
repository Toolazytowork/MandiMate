# MandiMate — nginx site for the `web` container (nginx:1.27-alpine).
#
# Serves the frontend build (frontend/dist/client) from /usr/share/nginx/html:
#   - prerendered public pages      /, /how-it-works, /faq, ...   (<route>/index.html)
#   - the signed-in SPA shell       /app/**                        (app.html)
#   - hashed, immutable bundles     /assets/**
# and proxies /api and /media to the FastAPI container (`api:8000` on the compose network).
#
# frontend/Dockerfile copies this file to /etc/nginx/conf.d/default.conf and the snippets/
# directory to /etc/nginx/snippets/ (named build context `nginx-config`, wired in
# docker-compose.yml). See docs/DEPLOYMENT.md.

# Cache policy keyed on the final URI, i.e. after index, try_files and error_page have
# resolved the file that is actually sent.
map $uri $mandimate_cache_control {
    default        "public, max-age=3600";
    ~\.html$       "no-cache";
}

# Keep the scheme reported by a TLS terminator in front of this container; otherwise use ours.
map $http_x_forwarded_proto $mandimate_forwarded_proto {
    default        $http_x_forwarded_proto;
    ""             $scheme;
}

server {
    # IPv4 only: compose networks are IPv4, and an IPv6 listener fails on hosts without IPv6.
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Resolve the API through Docker's embedded DNS on every request (cached 10 s) instead of
    # once at startup, so the web container survives API restarts and IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $mandimate_api http://api:8000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    error_page 404 /404.html;

    # Container liveness probe (used by the Dockerfile HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── API & uploaded media ──────────────────────────────────────────────────────────────
    location /api/ {
        # Harvest photos are accepted up to 8 MB (docs/API_CONTRACT.md); leave headroom for
        # multipart framing.
        client_max_body_size 10m;
        # Live AI calls (deal advice, voice parsing) may take tens of seconds.
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location /media/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # ── Static site ───────────────────────────────────────────────────────────────────────
    # Vite emits content-hashed file names under /assets, so they never change in place.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Signed-in application: client-rendered, never indexed. Every deep link boots app.html.
    location ~ ^/app(?:/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $mandimate_cache_control always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/index.html /app.html;
    }

    # The SPA shell itself (reached directly or through the fallback above).
    location = /app.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Prerendered public pages and root files (robots.txt, sitemap.xml, icons, OG images).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $mandimate_cache_control always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Only reachable through error_page, so it always carries a 404 status.
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
